name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  build-and-test:
    name: build & test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: clairvoyant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d clairvoyant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format and import order
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (Postgres)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/clairvoyant_test

  images:
    name: build images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: clairvoyant-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: indexer
          push: false
          tags: clairvoyant-indexer:ci
          cache-from: type=gha,scope=indexer
          cache-to: type=gha,scope=indexer,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          tags: clairvoyant-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
